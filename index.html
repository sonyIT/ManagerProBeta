<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manager Pro · Finances et projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f2f5f4;--sf:#fff;--tx:#14201d;--mt:#5f6f6a;--bd:#dde4e1;--pr:#0e7c66;--pr2:#dff2ec;--ok:#0e7c66;--ko:#c8372d;--wn:#c47a10;--nv:#14201d;--nt:#e8efec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1513;--sf:#16201d;--tx:#e8efec;--mt:#93a49e;--bd:#26332f;--pr:#3cc5a4;--pr2:#17332c;--ok:#3cc5a4;--ko:#ff7b6e;--wn:#f0b04a;--nv:#0a100e;--nt:#e8efec}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1513;--sf:#16201d;--tx:#e8efec;--mt:#93a49e;--bd:#26332f;--pr:#3cc5a4;--pr2:#17332c;--ok:#3cc5a4;--ko:#ff7b6e;--wn:#f0b04a;--nv:#0a100e;--nt:#e8efec}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;height:100%}
nav{width:210px;flex:none;background:var(--nv);color:var(--nt);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
nav h3{margin:0 8px 14px;font-size:18px;font-weight:800}
nav button{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer;opacity:.75}
nav button.on{background:var(--pr);color:#fff;opacity:1;font-weight:600}
nav .sp{flex:1}
main{flex:1;overflow:auto;padding:22px;min-width:0}
h1{margin:0 0 16px;font-size:26px;font-weight:800}h2{font-size:17px;margin:22px 0 10px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{padding:4px 0 4px 12px;border-left:4px solid var(--bd)}.k.ok{border-color:var(--ok)}.k.ko{border-color:var(--ko)}.k.wn{border-color:var(--wn)}
.k small{color:var(--mt);display:block}.k b{font-size:22px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input:disabled,select:disabled,textarea:disabled{opacity:.8;background:var(--bg)}
label{display:block;font-size:13px;color:var(--mt);margin:10px 0 3px}
button.b,button.g{font:inherit;border-radius:8px;padding:8px 13px;cursor:pointer;border:1px solid var(--pr)}
button.b{background:var(--pr);color:#fff}button.g{background:none;color:var(--pr)}button.d{border-color:var(--ko);color:var(--ko)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}.bar i.ko{background:var(--ko)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mt);font-weight:600;font-size:13px}
.tw{overflow-x:auto}.mt{color:var(--mt)}.ok{color:var(--ok)}.ko{color:var(--ko)}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--pr2);color:var(--pr);font-size:12px;margin:2px 4px 2px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tabs button{border:0;background:none;color:var(--mt);font:inherit;padding:6px 11px;border-radius:99px;cursor:pointer}.tabs button.on{background:var(--pr2);color:var(--pr);font-weight:600}
.kb{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--pr2);border-radius:10px;padding:8px;min-height:120px}.col h4{margin:2px 4px 8px}
.tk{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px;margin-bottom:8px;cursor:pointer}
.gt{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.gr{display:flex;height:38px;border-bottom:1px solid var(--bd)}
.gl{position:sticky;left:0;width:190px;flex:none;background:var(--sf);z-index:2;padding:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--bd);cursor:pointer}
.gc{position:relative;flex:none}.gh .gc span{position:absolute;top:10px;font-size:11px;color:var(--mt)}
.gb{position:absolute;top:8px;height:22px;border-radius:6px;background:var(--mt);cursor:pointer;overflow:hidden;opacity:.9}.gb i{display:block;height:100%;background:rgba(255,255,255,.45)}.gb.s1{background:var(--pr)}.gb.s2{background:var(--ok);opacity:.6}
.td{position:absolute;top:0;bottom:0;width:2px;background:var(--ko)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.md{background:var(--sf);border-radius:14px;max-width:560px;width:100%;max-height:92%;overflow:auto;padding:18px}
.md input,.md select,.md textarea{width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:99;display:none}
@media (max-width:760px){.app{flex-direction:column-reverse}nav{width:auto;flex-direction:row;overflow-x:auto;padding:6px}nav h3,nav .sp{display:none}nav button{white-space:nowrap}main{padding:14px}.kb{grid-template-columns:repeat(3,230px)}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const M=n=>{try{return new Intl.NumberFormat("fr-FR",{style:"currency",currency:S.cur||"XAF"}).format(n)}catch(e){return n+" "+(S.cur||"")}};
const day=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
const ST=["À faire","En cours","Terminé"],PR=["Basse","Normale","Haute"],ACC=["Lecteur","Membre","Gestionnaire"];
const nid=()=>Date.now()+Math.floor(Math.random()*999);
const PRE={"Accès à l’application":["Administrateur","Gestionnaire financier","Chef de projet","Membre","Lecteur"],"Encadrement de projet":["Directeur de projet","Conducteur de travaux","Chef de chantier","Responsable sécurité"],"Technique et ouvriers":["Ingénieur","Technicien","Contremaître","Maçon","Électricien","Plombier","Soudeur","Chauffeur d’engins","Ouvrier","Manœuvre"],"Support et administration":["Comptable","Acheteur","Magasinier"],"Intervenants externes":["Client","Sous-traitant","Fournisseur"]};
function seed(){
 const roles=[];Object.keys(PRE).forEach(c=>PRE[c].forEach(n=>roles.push({id:"p"+roles.length,name:n,cat:c,custom:false})));
 const rid=n=>roles.find(r=>r.name==n).id;
 const T=(pid,tid,title,s,e,st,pg,who,b,c)=>({id:nid()+Math.random(),pid,tid,title,desc:"",status:st,prio:1,start:iso(s),end:iso(e),progress:pg,assignee:who,budget:b,cost:c,log:[]});
 return{roles,projects:[{id:1,name:"Résidence A",budget:12000000},{id:2,name:"Site web client",budget:3000000}],
 teams:[{id:1,name:"Maçonnerie",pid:1,members:[{n:"Jean M.",r:rid("Chef de chantier")},{n:"Paul K.",r:rid("Maçon")},{n:"Didier B.",r:rid("Manœuvre")}]},{id:2,name:"Maçonnerie",pid:2,members:[]},{id:3,name:"Design",pid:2,members:[{n:"Grâce L.",r:rid("Technicien")}]}],
 tasks:[T(1,1,"Terrassement",-10,-3,2,100,"Jean M.",900000,850000),T(1,1,"Fondations",-4,8,1,60,"Paul K.",2500000,1500000),T(1,1,"Élévation des murs",6,24,0,0,"Jean M.",3500000,0),T(1,0,"Électricité",18,30,0,0,"",1800000,0),T(1,0,"Finitions",28,40,0,0,"",2200000,0),T(2,3,"Maquettes",-5,4,1,50,"Grâce L.",600000,300000),T(2,3,"Développement",5,25,0,0,"",1800000,0)],
 tx:[{id:1,label:"Acompte client",amt:6000000,type:"rev",pid:1,date:iso(-12)},{id:2,label:"Achat de ciment",amt:850000,type:"dep",pid:1,date:iso(-9)},{id:3,label:"Main-d’œuvre maçonnerie",amt:1200000,type:"dep",pid:1,date:iso(-3)},{id:4,label:"Acompte maquettes",amt:1000000,type:"rev",pid:2,date:iso(-6)},{id:5,label:"Hébergement et outils",amt:60000,type:"dep",pid:2,date:iso(-2)},{id:6,label:"Loyer du bureau",amt:300000,type:"dep",pid:0,date:iso(-1)}]}}
let S=(()=>{try{return JSON.parse(localStorage.getItem("gp3"))}catch(e){return null}})()||empty();
function empty(){const s=seed();s.projects=[];s.teams=[];s.tasks=[];s.tx=[];return s}
const save=()=>{try{localStorage.setItem("gp3",JSON.stringify(S))}catch(e){}};
let view="dash",cp=0,pv="gantt",tf="",et=0,mt=0,mtab="Détails",me=false,dr=0;
const P=id=>S.projects.find(p=>p.id==id)||{name:"Sans projet",budget:0},Rn=id=>(S.roles.find(r=>r.id==id)||{name:"—"}).name;
const same=(a,b)=>String(a)===String(b);
const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${E(v)}"${same(v,sel)?" selected":""}>${E(l)}</option>`).join("");
const pOpts=sel=>opt(S.projects.map(p=>[p.id,p.name]),sel);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const spent=p=>sum(S.tx.filter(t=>t.pid==p&&t.type=="dep"),t=>t.amt),inc=p=>sum(S.tx.filter(t=>t.pid==p&&t.type=="rev"),t=>t.amt);
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2600)}
function go(v){view=v;dz=0;render()}
 const CUR=(()=>{try{return Intl.supportedValuesOf("currency")}catch(e){return["XAF","XOF","EUR","USD","GBP","CAD","CDF","MAD","NGN","GHS","ZAR","CNY","JPY"]}})();
const cn=c=>{try{return new Intl.DisplayNames("fr",{type:"currency"}).of(c)}catch(e){return c}};
function setCur(c){S.cur=c;save();render()}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"}
function ensureRole(name,cat,acc,rate){name=name.trim();let r=S.roles.find(x=>x.name.toLowerCase()==name.toLowerCase());if(!r){r={id:"c"+nid(),name,cat:cat||"Personnalisé",custom:true,acc:acc||"Membre",rate:+rate||0};S.roles.push(r)}return r.id}
const V={};
const kp=(l,v,c)=>`<div class="k ${c||""}"><small>${l}</small><b>${v}</b></div>`;
V.dash=()=>{const r=sum(S.tx.filter(t=>t.type=="rev"),t=>t.amt),d=sum(S.tx.filter(t=>t.type=="dep"),t=>t.amt),late=S.tasks.filter(t=>t.status<2&&t.end<iso(0)).length;
 return`<h1>Tableau de bord</h1><div class="kp">${kp("Solde",M(r-d),r-d>=0?"ok":"ko")}${kp("Revenus",M(r),"ok")}${kp("Dépenses",M(d),"ko")}${kp("Tâches en retard",late,late?"wn":"")}</div><h2>Budget et rentabilité par projet</h2>`+
 S.projects.map(p=>{const s=spent(p.id),i=inc(p.id),ts=S.tasks.filter(t=>t.pid==p.id),av=ts.length?Math.round(sum(ts,t=>t.progress)/ts.length):0,pc=p.budget?s/p.budget*100:0;
 return`<div class="card"><div class="row"><b>${E(p.name)}</b><span class="mt">avancement ${av} %</span></div><div class="bar"><i class="${pc>100?"ko":""}" style="width:${Math.min(100,pc)}%"></i></div><div class="row mt">Dépensé ${M(s)} sur ${M(p.budget)} (reste ${M(p.budget-s)})</div><div>Résultat du projet : <b class="${i-s>=0?"ok":"ko"}">${M(i-s)}</b></div></div>`}).join("")};
V.fin=()=>`<h1>Finances</h1><div class="card"><div class="row"><input id="xl" placeholder="Libellé"><input  placeholder="Montant"><select id="xt"><option value="dep">Dépense</option><option value="rev">Revenu</option></select><select id="xp"><option value="0">Sans projet</option>${pOpts("")}</select><input id="xd" type="date" value="${iso(0)}"><button class="b" onclick="addTx()">Ajouter l’opération</button></div></div><div class="card tw"><table><tr><th>Date</th><th>Libellé</th><th>Projet</th><th>Montant</th><th></th></tr>${[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${t.date}</td><td>${E(t.label)}</td><td>${E(P(t.pid).name)}</td><td class="${t.type=="rev"?"ok":"ko"}">${t.type=="rev"?"+":"−"} ${M(t.amt)}</td><td><button class="g d" onclick="delTx(${t.id})">Supprimer</button></td></tr>`).join("")}</table></div>`;
function addTx(){const l=$("#xl").value.trim(),a=+$("#xa").value;if(!l||!(a>0))return toast("Saisissez un libellé et un montant supérieur à 0.");S.tx.push({id:nid(),label:l,amt:a,type:$("#xt").value,pid:+$("#xp").value,date:$("#xd").value||iso(0)});save();render();toast("Opération ajoutée.")}
function delTx(id){S.tx=S.tx.filter(t=>t.id!=id);save();render()}
function gantt(ts){if(!ts.length)return`<div class="card mt">Aucune tâche. Ajoutez-en une pour voir le diagramme.</div>`;
 const a=Math.min(...ts.map(t=>day(t.start)))-1,b=Math.max(...ts.map(t=>day(t.end)))+2,pd=26,w=(b-a+1)*pd,td=day(iso(0));
 const tdl=td>=a&&td<=b?`<div class="td" style="left:${(td-a)*pd}px"></div>`:"";let h="";
 for(let i=0;i<=b-a;i+=7)h+=`<span style="left:${i*pd+2}px">${new Date((a+i)*864e5).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",timeZone:"UTC"})}</span>`;
 return`<div class="gt"><div style="width:${w+190}px"><div class="gr gh"><div class="gl mt">Tâche</div><div class="gc" style="width:${w}px">${h}${tdl}</div></div>`+ts.map(t=>`<div class="gr"><div class="gl" onclick="openT(${t.id})" title="${E(t.title)}">${E(t.title)}</div><div class="gc" style="width:${w}px">${tdl}<div class="gb s${t.status}" onclick="openT(${t.id})" style="left:${(day(t.start)-a)*pd}px;width:${(day(t.end)-day(t.start)+1)*pd}px" title="${E(t.title)} · ${t.progress} %"><i style="width:${t.progress}%"></i></div></div></div>`).join("")+`</div></div><p class="mt">Barre claire : avancement. Ligne rouge : aujourd’hui. Cliquez une barre pour modifier la tâche.</p>`}
function kanban(ts){return`<div class="kb">${ST.map((s,i)=>`<div class="col" ondragover="event.preventDefault()" ondrop="mv(${i})"><h4>${s} (${ts.filter(t=>t.status==i).length})</h4>${ts.filter(t=>t.status==i).map(t=>`<div class="tk" draggable="true" ondragstart="dr=${t.id}" onclick="openT(${t.id})"><b>${E(t.title)}</b><div class="mt">${E(t.assignee||"Non assignée")} · fin ${t.end}</div><div class="bar"><i style="width:${t.progress}%"></i></div></div>`).join("")}</div>`).join("")}</div>`}
function mv(s){const t=S.tasks.find(x=>x.id==dr);if(t&&t.status!=s){t.log.unshift({d:new Date().toLocaleString("fr-FR"),t:"Détails",m:`Statut : ${ST[t.status]} → ${ST[s]}`});t.status=s;if(s==2)t.progress=100;save();render()}}
function list(ts){return`<div class="card tw"><table><tr><th>Tâche</th><th>Équipe</th><th>Responsable</th><th>Statut</th><th>Dates</th><th>%</th><th></th></tr>${ts.map(t=>{const q=S.teams.find(x=>x.id==t.tid);return`<tr><td>${E(t.title)}</td><td>${q?E(q.name+" · "+P(q.pid).name):"—"}</td><td>${E(t.assignee||"—")}</td><td>${ST[t.status]}</td><td>${t.start} → ${t.end}</td><td>${t.progress}</td><td><button class="g" onclick="openT(${t.id})">Modifier</button></td></tr>`}).join("")}</table></div>`}
V.proj=()=>{if(!P(cp).id)cp=S.projects[0]&&S.projects[0].id;const ts=S.tasks.filter(t=>t.pid==cp).sort((a,b)=>a.start.localeCompare(b.start));
 return`<h1>Projets</h1><div class="row"><div class="tabs">${S.projects.map(p=>`<button class="${p.id==cp?"on":""}" onclick="cp=${p.id};render()">${E(p.name)}</button>`).join("")}</div><input id="np" placeholder="Nouveau projet" style="width:150px"><input  placeholder="Budget" style="width:110px"><button class="g" onclick="addP()">Créer</button></div>
 <div class="row" style="justify-content:space-between"><div class="tabs">${[["gantt","Diagramme de Gantt"],["kanban","Kanban"],["list","Liste"]].map(([k,l])=>`<button class="${pv==k?"on":""}" onclick="pv='${k}';render()">${l}</button>`).join("")}</div><span><button class="b" onclick="newT()">Ajouter une tâche</button> <button class="g d" onclick="delP()">${dc==cp?"Confirmer la suppression":"Supprimer le projet"}</button></span></div>${pv=="gantt"?gantt(ts):pv=="kanban"?kanban(ts):list(ts)}`};
function addP(){const n=$("#np").value.trim();if(!n)return toast("Donnez un nom au projet.");const p={id:nid(),name:n,budget:+$("#nb").value||0};S.projects.push(p);cp=p.id;save();render()}
function newT(){const t={id:nid(),pid:cp,tid:0,title:"Nouvelle tâche",desc:"",status:0,prio:1,start:iso(0),end:iso(7),progress:0,assignee:"",budget:0,cost:0,log:[]};S.tasks.push(t);save();openT(t.id,true)}
const TABS={"Détails":[["title","Titre","text"],["desc","Description","area"],["status","Statut","sel",ST],["prio","Priorité","sel",PR]],"Assignation":[["tid","Équipe du projet","team"],["assignee","Responsable","text"]],"Planning":[["start","Date de début","date"],["end","Date de fin","date"],["progress","Avancement (%)","num"]],"Budget":[["budget","Budget prévu","num"],["cost","Coût réel","num"]],"Historique":[]};
function openT(id,edit){mt=id;me=!!edit;mtab="Détails";modal()}
function setTab(t){mtab=t;me=false;modal()}
function modal(){const t=S.tasks.find(x=>x.id==mt);if(!t){$("#modal").innerHTML="";return}const fs=TABS[mtab],dis=me?"":"disabled";
 const f=fs.map(([k,l,ty,o])=>{const v=t[k],id="f_"+k;let c;
  if(ty=="area")c=`<textarea id="${id}" rows="3" ${dis}>${E(v)}</textarea>`;
  else if(ty=="sel")c=`<select id="${id}" ${dis}>${opt(o.map((x,i)=>[i,x]),v)}</select>`;
  else if(ty=="team")c=`<select id="${id}" ${dis}><option value="0">Aucune</option>${opt(S.teams.filter(q=>q.pid==t.pid).map(q=>[q.id,q.name+" · "+P(q.pid).name]),v)}</select>`;
  else c=`<input id="${id}" type="${ty=="num"?"number":ty}" step="any" value="${E(v)}" ${dis}>`;return`<label for="${id}">${l}</label>${c}`}).join("");
 const hist=mtab=="Historique"?(t.log.length?t.log.map(h=>`<div class="mt">${E(h.d)} · ${E(h.t)} : ${E(h.m)}</div>`).join(""):`<p class="mt">Aucune modification enregistrée.</p>`):"";
 $("#modal").innerHTML=`<div class="ov" onclick="if(event.target==this)closeT()"><div class="md"><div class="row" style="justify-content:space-between"><b style="font-size:18px">${E(t.title)}</b><button class="g" onclick="closeT()">Fermer</button></div><div class="tabs">${Object.keys(TABS).map(k=>`<button class="${k==mtab?"on":""}" onclick="setTab('${k}')">${k}</button>`).join("")}</div>${f}${hist}${mtab=="Historique"?"":`<div class="row" style="margin-top:14px">${me?`<button class="b" onclick="saveT()">Enregistrer</button><button class="g" onclick="me=false;modal()">Annuler</button>`:`<button class="b" onclick="me=true;modal()">Modifier cet onglet</button>`}<span style="flex:1"></span><button class="g d" onclick="delT()">Supprimer la tâche</button></div>`}</div></div>`}
function saveT(){const t=S.tasks.find(x=>x.id==mt),nv={};
 TABS[mtab].forEach(([k,l,ty])=>{let v=$("#f_"+k).value;if(ty=="sel"||ty=="team"||ty=="num")v=+v;nv[k]=v});
 if(nv.title!==undefined&&!nv.title.trim())return toast("Le titre est obligatoire.");
 const s=nv.start||t.start,e=nv.end||t.end;if(e<s)return toast("La date de fin doit suivre la date de début.");
 if(nv.progress!==undefined)nv.progress=Math.max(0,Math.min(100,nv.progress));
 TABS[mtab].forEach(([k,l])=>{if(nv[k]!==t[k]){t.log.unshift({d:new Date().toLocaleString("fr-FR"),t:mtab,m:l+" modifié"});t[k]=nv[k]}});
 me=false;save();modal();render();toast("Onglet enregistré.")}
function closeT(){mt=0;me=false;modal()}
function delT(){S.tasks=S.tasks.filter(t=>t.id!=mt);save();closeT();render();toast("Tâche supprimée.")}
V.team=()=>{const ps=S.projects.filter(p=>!tf||p.id==tf);
 return`<h1>Équipes</h1><div class="card"><div class="row"><select id="tp">${pOpts(cp)}</select><input id="tn" placeholder="Nom de l’équipe (ex. Maçonnerie)"><button class="b" onclick="addTeam()">Créer l’équipe</button></div><p class="mt" style="margin:8px 0 0">Le projet est obligatoire : son nom s’ajoute à celui de l’équipe pour éviter les confusions.</p></div>
 <div class="row"><span class="mt">Filtrer par projet</span><select onchange="tf=this.value;render()"><option value="">Tous les projets</option>${pOpts(tf)}</select></div>`+
 ps.map(p=>`<h2>${E(p.name)}</h2>`+(S.teams.filter(t=>t.pid==p.id).map(t=>teamCard(t,p)).join("")||`<p class="mt">Aucune équipe sur ce projet.</p>`)).join("")};
function teamCard(t,p){const ed=et==t.id;
 return`<div class="card"><div class="row" style="justify-content:space-between">${ed?`<input id="en${t.id}" value="${E(t.name)}"><select id="ep${t.id}">${pOpts(t.pid)}</select>`:`<b>${E(t.name)} · ${E(p.name)}</b>`}<span>${ed?`<button class="b" onclick="saveTeam(${t.id})">Enregistrer</button> <button class="g" onclick="et=0;render()">Annuler</button>`:`<button class="g" onclick="et=${t.id};render()">Modifier</button> <button class="g d" onclick="delTeam(${t.id})">Supprimer</button>`}</span></div>
 <div style="margin:8px 0">${t.members.map((m,i)=>`<span class="tag">${E(m.n)} · ${E(Rn(m.r))} <a href="#" onclick="rmM(${t.id},${i});return false" style="color:inherit" aria-label="Retirer">×</a></span>`).join("")||`<span class="mt">Aucun membre.</span>`}</div>
 <div class="row"><input id="mn${t.id}" placeholder="Nom du membre" style="width:150px"><select id="mr${t.id}">${rOpts()}</select><input id="mx${t.id}" placeholder="ou saisir un nouveau rôle" style="width:190px"><button class="g" onclick="addM(${t.id})">Ajouter le membre</button></div></div>`}
function rOpts(){return Object.keys(PRE).concat(["Personnalisé"]).map(c=>{const rs=S.roles.filter(r=>r.cat==c);return rs.length?`<optgroup label="${E(c)}">${opt(rs.map(r=>[r.id,r.name]),"")}</optgroup>`:""}).join("")}
function addTeam(){const p=+$("#tp").value,n=$("#tn").value.trim();if(!p)return toast("Choisissez un projet.");if(!n)return toast("Donnez un nom à l’équipe.");
 if(S.teams.some(t=>t.pid==p&&t.name.toLowerCase()==n.toLowerCase()))return toast("Ce projet a déjà une équipe portant ce nom.");S.teams.push({id:nid(),name:n,pid:p,members:[]});save();render();toast("Équipe créée : "+n+" · "+P(p).name)}
function saveTeam(id){const t=S.teams.find(x=>x.id==id),n=$("#en"+id).value.trim(),p=+$("#ep"+id).value;if(!n)return toast("Le nom est obligatoire.");
 if(S.teams.some(x=>x.id!=id&&x.pid==p&&x.name.toLowerCase()==n.toLowerCase()))return toast("Ce projet a déjà une équipe portant ce nom.");
 if(p!=t.pid)S.tasks.forEach(k=>{if(k.tid==id)k.tid=0});t.name=n;t.pid=p;et=0;save();render()}
function delTeam(id){S.teams=S.teams.filter(t=>t.id!=id);S.tasks.forEach(k=>{if(k.tid==id)k.tid=0});save();render()}
function addM(id){const n=$("#mn"+id).value.trim(),x=$("#mx"+id).value.trim();if(!n)return toast("Saisissez le nom du membre.");
 const r=x?ensureRole(x):$("#mr"+id).value;S.teams.find(t=>t.id==id).members.push({n,r});save();render();if(x)toast("Rôle « "+x+" » ajouté à la liste.")}
function rmM(id,i){S.teams.find(t=>t.id==id).members.splice(i,1);save();render()}
V.roles=()=>`<h1>Rôles</h1><div class="card"><div class="row"><input id="rn" placeholder="Nom du rôle"><select id="ra">${ACC.map(a=>`<option>${a}</option>`).join("")}</select><input  placeholder="Taux journalier"><button class="b" onclick="addRole()">Ajouter le rôle</button></div><p class="mt" style="margin:8px 0 0">Le niveau d’accès définit ce que la personne peut faire dans l’application. Le rôle personnalisé reste disponible pour toutes les équipes.</p></div>`+
 Object.keys(PRE).concat(["Personnalisé"]).map(c=>{const rs=S.roles.filter(r=>r.cat==c);return rs.length?`<h2>${E(c)}</h2><div class="card">${rs.map(r=>`<span class="tag">${E(r.name)}${r.custom?` · ${E(r.acc)}${r.rate?" · "+M(r.rate):""} <a href="#" onclick="delRole('${r.id}');return false" style="color:inherit" aria-label="Supprimer">×</a>`:""}</span>`).join("")}</div>`:""}).join("");
function addRole(){const n=$("#rn").value.trim();if(!n)return toast("Saisissez le nom du rôle.");if(S.roles.some(r=>r.name.toLowerCase()==n.toLowerCase()))return toast("Ce rôle existe déjà.");ensureRole(n,"Personnalisé",$("#ra").value,$("#rr").value);save();render();toast("Rôle ajouté.")}
function delRole(id){if(S.teams.some(t=>t.members.some(m=>m.r==id)))return toast("Ce rôle est utilisé : retirez-le des équipes d’abord.");S.roles=S.roles.filter(r=>r.id!=id);save();render()}
let dc=0,dz=0;
const p0=V.proj,t0=V.team,d0=V.dash;
V.proj=()=>S.projects.length?p0():`<h1>Projets</h1><div class="card"><b>Aucun projet en cours</b><div class="row" style="margin-top:10px"><input id="np" placeholder="Nom du projet"><input  placeholder="Budget"><button class="b" onclick="addP()">Créer le projet</button></div></div>`;
V.team=()=>S.projects.length?t0():`<h1>Équipes</h1><div class="card mt">Créez d’abord un projet : chaque équipe est rattachée à un projet.</div><button class="b" onclick="go('proj')">Créer un projet</button>`;
V.dash=()=>d0()+(S.projects.length?"":`<div class="card"><b>Aucun projet en cours</b><p class="mt">Créez votre premier projet pour suivre son budget, ses tâches et son avancement.</p><button class="b" onclick="go('proj')">Créer un projet</button></div>`)+`<div class="row" style="margin-top:18px"><button class="g d" onclick="resetAll()">${dz?"Confirmer : tout effacer":"Tout effacer et repartir à zéro"}</button></div>`;
function delP(){if(dc!=cp){dc=cp;render();return toast("Cliquez de nouveau pour supprimer ce projet, ses tâches, ses équipes et ses opérations.")}const id=cp;S.projects=S.projects.filter(p=>p.id!=id);S.tasks=S.tasks.filter(t=>t.pid!=id);S.teams=S.teams.filter(t=>t.pid!=id);S.tx=S.tx.filter(t=>t.pid!=id);dc=0;cp=S.projects[0]?S.projects[0].id:0;save();render();toast("Projet supprimé.")}
function resetAll(){if(!dz){dz=1;render();return toast("Cliquez de nouveau pour effacer tous les projets et opérations.")}S.projects=[];S.tasks=[];S.teams=[];S.tx=[];dz=0;cp=0;save();render();toast("Tout est effacé.")}
function render(){const it=[["dash","Tableau de bord"],["fin","Finances"],["proj","Projets"],["team","Équipes"],["roles","Rôles"]];
 $("#nav").innerHTML=`<h3>Manager Pro</h3>`+it.map(([k,l])=>`<button class="${view==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")+`<select style="margin-bottom:8px" onchange="setCur(this.value)" aria-label="Devise">${CUR.map(c=>`<option value="${c}"${c==(S.cur||"XAF")?" selected":""}>${c} · ${cn(c)}</option>`).join("")}</select><span class="sp"></span><button onclick="theme()">Mode clair ou sombre</button>`;
 $("#main").innerHTML=V[view]();modal()}
render();
</script></body></html>
